<section class="password-dialog" aria-labelledby="password-title">
  <header class="dialog-header">
    <div class="header-icon" aria-hidden="true">
      <i class="bi bi-shield-lock"></i>
    </div>
    <div class="header-copy">
      <h2 id="password-title">Change password</h2>
      <p>Choose a strong password to keep your account secure.</p>
    </div>
    <button class="close-button" type="button" aria-label="Close dialog" (click)="closeDialog()">
      <i class="bi bi-x-lg"></i>
    </button>
  </header>

  <form [formGroup]="passwordForm" (ngSubmit)="newPassword(passwordForm.value)" novalidate>
    <div class="dialog-body">
      <label class="password-field" for="current-password">
        <span class="field-label">Current password</span>
        <span class="input-wrap" [class.invalid]="controls['opassword'].touched && controls['opassword'].invalid">
          <i class="bi bi-lock input-icon" aria-hidden="true"></i>
          <input
            id="current-password"
            [type]="showCurrentPassword ? 'text' : 'password'"
            placeholder="Enter your current password"
            formControlName="opassword"
            autocomplete="current-password"
            required>
          <button
            class="visibility-button"
            type="button"
            [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'"
            (click)="showCurrentPassword = !showCurrentPassword">
            <i [class]="showCurrentPassword ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
          </button>
        </span>
        @if (controls['opassword'].touched && controls['opassword'].hasError('required')) {
          <small class="field-error">Enter your current password.</small>
        } @else if (controls['opassword'].touched && controls['opassword'].hasError('minlength')) {
          <small class="field-error">Password must be at least 6 characters.</small>
        }
      </label>

      <label class="password-field" for="new-password">
        <span class="field-label">New password</span>
        <span class="input-wrap" [class.invalid]="controls['npassword'].touched && controls['npassword'].invalid">
          <i class="bi bi-key input-icon" aria-hidden="true"></i>
          <input
            id="new-password"
            [type]="showNewPassword ? 'text' : 'password'"
            placeholder="At least 6 characters"
            formControlName="npassword"
            autocomplete="new-password"
            required>
          <button
            class="visibility-button"
            type="button"
            [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'"
            (click)="showNewPassword = !showNewPassword">
            <i [class]="showNewPassword ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
          </button>
        </span>
        @if (controls['npassword'].touched && controls['npassword'].hasError('required')) {
          <small class="field-error">Enter a new password.</small>
        } @else if (controls['npassword'].touched && controls['npassword'].hasError('minlength')) {
          <small class="field-error">Use at least 6 characters.</small>
        }
      </label>

      <label class="password-field" for="confirm-password">
        <span class="field-label">Confirm new password</span>
        <span
          class="input-wrap"
          [class.invalid]="controls['cpassword'].touched && (controls['cpassword'].invalid || passwordForm.hasError('mustmatch'))">
          <i class="bi bi-check2-circle input-icon" aria-hidden="true"></i>
          <input
            id="confirm-password"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Re-enter your new password"
            formControlName="cpassword"
            autocomplete="new-password"
            required>
          <button
            class="visibility-button"
            type="button"
            [attr.aria-label]="showConfirmPassword ? 'Hide confirmation password' : 'Show confirmation password'"
            (click)="showConfirmPassword = !showConfirmPassword">
            <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
          </button>
        </span>
        @if (controls['cpassword'].touched && controls['cpassword'].hasError('required')) {
          <small class="field-error">Confirm your new password.</small>
        } @else if (controls['cpassword'].touched && controls['cpassword'].hasError('minlength')) {
          <small class="field-error">Use at least 6 characters.</small>
        } @else if (controls['cpassword'].touched && passwordForm.hasError('mustmatch')) {
          <small class="field-error">The passwords do not match.</small>
        }
      </label>

      <div class="security-hint">
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span>Use at least 6 characters. Avoid reusing a password from another site.</span>
      </div>
    </div>

    <footer class="dialog-footer">
      <button type="button" class="cancel-button" (click)="cancelDialog()">Cancel</button>
      <button type="submit" class="submit-button" [disabled]="passwordForm.invalid">
        <i class="bi bi-shield-check" aria-hidden="true"></i>
        Update password
      </button>
    </footer>
  </form>
</section>
