<div class="container">
  <div class="sidenav">

      <!-- Toggle button at top -->
      <button class="toggle-btn"  [title]="collapsed ? 'Collapse' : 'Expand'">
        <i class="bi bi-layout-sidebar-reverse"></i>
      </button>

      <!-- Navigation links — always show icon, show label when space -->
      <ul class="sidenav-nav">
        @for (data of navdata; track data) {
          <li class="sidenav-nav-item">
            <a
              class="sidenav-nav-link"
              [routerLink]="data.routerLink"
              routerLinkActive="url_active"
              [routerLinkActiveOptions]="{ exact: true }"
              [title]="data.label"
            >
              <i class="sidenav-link-icon" [class]="data.icon"></i>
              <span class="sidenav-link-text">{{ data.label }}</span>
            </a>
          </li>
        }
      </ul>

      <!-- User avatar at bottom -->
      <div class="sidenav-bottom">
        <div class="user-mini">
          <div class="user-avatar">
            {{ userName ? userName[0].toUpperCase() : 'U' }}
          </div>
        </div>
      </div>

  </div>
</div>
