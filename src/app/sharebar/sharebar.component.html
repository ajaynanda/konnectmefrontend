<div class="share-card">
  <form #form="ngForm" (ngSubmit)="submit(form)" enctype="multipart/form-data">

    <!-- Header: avatar + textarea -->
    <div class="share-header">
      <img src="../../assets/media.jpg" class="share-avatar" alt="your avatar">
      <div class="share-textarea-wrapper">
        <textarea
          name="desc"
          ngModel
          class="share-textarea"
          placeholder="What's on your mind? Share something..."
        ></textarea>
      </div>
    </div>

    <!-- Media Preview -->
    @if (imagePreviewSrc && isImageSelected) {
      <div class="media-preview">
        <img [src]="imagePreviewSrc" alt="selected image">
        <button type="button" class="media-remove-btn" (click)="isImageSelected=false">
          <i class="bi bi-x"></i>
        </button>
      </div>
    }
    @if (videoPreview && isVideoSelected) {
      <div class="media-preview">
        <video [src]="videoPreview" height="200" controls></video>
      </div>
    }

    <div class="share-divider"></div>

    <!-- Footer: action buttons + submit -->
    <div class="share-footer">
      <div class="share-actions">
        <label class="action-btn photo" htmlfor="file" title="Add photo or video">
          <i class="bi bi-images"></i>
          <span>Media</span>
          <input style="display:none;" type="file" id="file" name="img" ngModel single (change)="onFileChange($event)">
        </label>
        <button type="button" class="action-btn tag" title="Tag someone">
          <i class="bi bi-tag-fill"></i>
          <span>Tag</span>
        </button>
        <button type="button" class="action-btn location" title="Add location">
          <i class="bi bi-geo-alt-fill"></i>
          <span>Location</span>
        </button>
        <button type="button" class="action-btn feeling" title="Add feeling">
          <i class="bi bi-emoji-smile-fill"></i>
          <span>Feeling</span>
        </button>
      </div>

      <button type="submit" class="share-btn">
        <i class="bi bi-send-fill"></i>
        Post
      </button>
    </div>

  </form>
</div>
