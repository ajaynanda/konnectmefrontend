<div class="app-shell">

  <!-- Sidebar -->
  <div class="sidebar-col" [class.expanded]="sidebar" [class.collapsed]="!sidebar">
    <app-leftbar></app-leftbar>
  </div>

  @if (currentUrl !== '/user/dashboard/chat') {
    <!-- Feed Column -->
    <div class="feed-col" [class.sidebar-open]="sidebar" [class.sidebar-closed]="!sidebar">
      <section class="post-feed-scroll" aria-label="Posts feed">
        <app-sharebar></app-sharebar>
        <app-postbar></app-postbar>
      </section>
    </div>

    <!-- Right Panel -->
    <div class="right-col">
      <app-rightbar></app-rightbar>
    </div>

  } @else {
    <!-- Chat Full Width -->
    <div class="chat-col" [class.sidebar-open]="sidebar" [class.sidebar-closed]="!sidebar">
      <app-chat></app-chat>
    </div>
  }

</div>
